<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertical Velocity</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <h1 id="title">Vertical Velocity</h1>
      <div id="language"></div>
    </header>
    <main>
      <div id="dropzone"></div>
      <div id="immobility"></div>
      <p id="message" hidden></p>

      <section id="profile" hidden>
        <h2 data-title="section-profile">Elevation profile</h2>
        <div class="chart-container"><canvas id="chart"></canvas></div>
      </section>

      <section id="totals" hidden>
        <h2 data-title="section-totals">Totals</h2>
        <dl id="summary"></dl>
      </section>

      <section id="climbs" hidden>
        <h2 data-title="section-climbs">Climbs</h2>
        <div id="table"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
